# Desktop sidecar dependencies.
#
# Mirrors upstream MoneyPrinterTurbo's pyproject with two differences:
#   * streamlit / streamlit-tour are dropped -- the React frontend replaces the
#     Streamlit WebUI, and app/ has no Streamlit imports.
#   * pyinstaller is added so the sidecar can be frozen into a single binary.
[project]
name = "ca-desktop-backend"
# Tracks the vendored MoneyPrinterTurbo release (app/__init__.py::__version__),
# not the desktop app version, which lives in src-tauri/tauri.conf.json. Keeping
# them equal is what test_version_checker.py guards against drifting.
version = "1.3.4"
description = "MoneyPrinterTurbo backend packaged as a Tauri sidecar."
requires-python = ">=3.11,<3.12"
dependencies = [
    "moviepy==2.2.1",
    "edge-tts==7.3.1",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "litellm==1.86.2",
    "google-genai==2.11.0",
    "toml==0.10.2",
]

[dependency-groups]
dev = [
    "pyinstaller==6.16.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false
